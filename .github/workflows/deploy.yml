name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: prism-tv
          directory: .

      - name: Verify live
        run: |
          set -e
          for i in $(seq 1 12); do
            if curl -sf https://prism-tv.pages.dev/assets/prism.js | grep -q "mountPrism"; then
              echo "live markers OK (attempt $i)"; exit 0
            fi
            echo "attempt $i: not propagated yet"; sleep 10
          done
          echo "live markers never appeared"; exit 1
