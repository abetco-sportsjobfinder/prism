name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cloudflare/pages-action was unpublished by Cloudflare (first failure
      # 2026-10-01: "Unable to resolve action cloudflare/pages-action, not
      # found"), which silently broke this workflow for a month. wrangler-action
      # is the maintained successor and deploys the checked-out tree. The
      # 2026-10-01 release was pushed manually via `wrangler pages deploy`.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=prism-tv --branch=main

      - name: Verify live
        run: |
          set -e
          for i in $(seq 1 12); do
            if curl -sf https://prism-tv.pages.dev/assets/prism.js | grep -q "mountPrism"; then
              echo "live markers OK (attempt $i)"; exit 0
            fi
            echo "attempt $i: not propagated yet"; sleep 10
          done
          echo "live markers never appeared"; exit 1
